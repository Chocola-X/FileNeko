name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go test --race ./...

  build:
    name: Build and Package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Install Task
        uses: go-task/setup-task@v2
      - run: task build
      - name: Package test binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: release --snapshot --clean --skip=publish,docker,homebrew
      - name: Verify binaries and packages
        working-directory: dist
        run: |
          sha256sum --check *checksums.txt
          mkdir -p "$RUNNER_TEMP/filebrowser-ci"
          tar -xzf linux-amd64-filebrowser.tar.gz -C "$RUNNER_TEMP/filebrowser-ci" filebrowser
          for ci_binary in ../filebrowser "$RUNNER_TEMP/filebrowser-ci/filebrowser"; do
            test -x "$ci_binary"
            "$ci_binary" version
            file "$ci_binary"
            if readelf -l "$ci_binary" | grep -q INTERP; then
              echo "Unexpected dynamic interpreter in Linux binary"
              exit 1
            fi
            if readelf -d "$ci_binary" | grep -q NEEDED; then
              echo "Unexpected shared library dependency in Linux binary"
              exit 1
            fi
          done
      - name: Upload linux amd64
        uses: ./.github/actions/upload-package
        with:
          path: dist/linux-amd64-filebrowser.tar.gz
      - name: Upload linux 386
        uses: ./.github/actions/upload-package
        with:
          path: dist/linux-386-filebrowser.tar.gz
      - name: Upload linux armv5
        uses: ./.github/actions/upload-package
        with:
          path: dist/linux-armv5-filebrowser.tar.gz
      - name: Upload linux armv6
        uses: ./.github/actions/upload-package
        with:
          path: dist/linux-armv6-filebrowser.tar.gz
      - name: Upload linux armv7
        uses: ./.github/actions/upload-package
        with:
          path: dist/linux-armv7-filebrowser.tar.gz
      - name: Upload linux arm64
        uses: ./.github/actions/upload-package
        with:
          path: dist/linux-arm64-filebrowser.tar.gz
      - name: Upload linux riscv64
        uses: ./.github/actions/upload-package
        with:
          path: dist/linux-riscv64-filebrowser.tar.gz
      - name: Upload windows amd64
        uses: ./.github/actions/upload-package
        with:
          path: dist/windows-amd64-filebrowser.zip
      - name: Upload windows 386
        uses: ./.github/actions/upload-package
        with:
          path: dist/windows-386-filebrowser.zip
      - name: Upload windows arm64
        uses: ./.github/actions/upload-package
        with:
          path: dist/windows-arm64-filebrowser.zip
      - name: Upload darwin amd64
        uses: ./.github/actions/upload-package
        with:
          path: dist/darwin-amd64-filebrowser.tar.gz
      - name: Upload darwin arm64
        uses: ./.github/actions/upload-package
        with:
          path: dist/darwin-arm64-filebrowser.tar.gz
      - name: Upload freebsd amd64
        uses: ./.github/actions/upload-package
        with:
          path: dist/freebsd-amd64-filebrowser.tar.gz
      - name: Upload freebsd 386
        uses: ./.github/actions/upload-package
        with:
          path: dist/freebsd-386-filebrowser.tar.gz
      - name: Upload freebsd arm64
        uses: ./.github/actions/upload-package
        with:
          path: dist/freebsd-arm64-filebrowser.tar.gz
      - name: Upload openbsd amd64
        uses: ./.github/actions/upload-package
        with:
          path: dist/openbsd-amd64-filebrowser.tar.gz
      - name: Upload openbsd 386
        uses: ./.github/actions/upload-package
        with:
          path: dist/openbsd-386-filebrowser.tar.gz
      - name: Upload openbsd armv5
        uses: ./.github/actions/upload-package
        with:
          path: dist/openbsd-armv5-filebrowser.tar.gz
      - name: Upload openbsd armv6
        uses: ./.github/actions/upload-package
        with:
          path: dist/openbsd-armv6-filebrowser.tar.gz
      - name: Upload openbsd armv7
        uses: ./.github/actions/upload-package
        with:
          path: dist/openbsd-armv7-filebrowser.tar.gz
      - name: Upload openbsd arm64
        uses: ./.github/actions/upload-package
        with:
          path: dist/openbsd-arm64-filebrowser.tar.gz
      - name: Upload package checksums
        uses: ./.github/actions/upload-package
        with:
          path: dist/*checksums.txt

  release:
    name: Release
    needs: ["lint-frontend", "test-frontend", "lint-backend", "test", "build"]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install Task
        uses: go-task/setup-task@v2
      - run: task build:frontend
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



