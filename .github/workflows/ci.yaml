name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go test --race ./...

  prepare-builds:
    name: Prepare Build Matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      go-version: ${{ steps.go.outputs.go-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        id: go
        with:
          go-version: "1.26.x"
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - run: go mod download
      - name: Derive targets from the release configuration
        id: matrix
        run: |
          go test ./.github/ci
          echo "matrix=$(go run ./.github/ci matrix)" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build Shared Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Prepare shared frontend assets
        run: |
          test -s frontend/dist/public/index.html
          tar -cf "$RUNNER_TEMP/fileneko-frontend.tar" -C frontend/dist .
      - name: Upload shared frontend
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/fileneko-frontend.tar
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build and Package (${{ matrix.target }})
    needs: [prepare-builds, build-frontend]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-builds.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        id: go
        with:
          go-version: ${{ needs.prepare-builds.outputs.go-version }}
          cache: false
      - name: Restore shared Go modules
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - name: Cache target compilation
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ steps.go.outputs.go-version }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ steps.go.outputs.go-version }}-${{ matrix.target }}-
      - name: Download shared frontend
        uses: actions/download-artifact@v8
        with:
          name: fileneko-frontend.tar
          path: ${{ runner.temp }}/frontend
          skip-decompress: true
      - name: Restore assets and select target
        env:
          CI_TARGET: ${{ matrix.target }}
        run: |
          tar -xf "$RUNNER_TEMP/frontend/fileneko-frontend.tar" -C frontend/dist
          test -s frontend/dist/public/index.html
          go run ./.github/ci config "$CI_TARGET" "$RUNNER_TEMP/goreleaser.yml"
      - name: Package target binary
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: release --config ${{ runner.temp }}/goreleaser.yml --snapshot --clean --skip=publish,docker,homebrew
      - name: Verify binary and package
        env:
          CI_ARCHIVE: ${{ matrix.archive }}
        run: |
          (cd dist && sha256sum --check *checksums.txt)
          python3 .github/ci/packages.py verify dist "$CI_ARCHIVE"
      - name: Upload platform package
        uses: ./.github/actions/upload-package
        with:
          path: dist/${{ matrix.archive }}

  checksums:
    name: Verify Matrix Packages
    needs: [prepare-builds, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: "*-fileneko.*"
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Verify complete target set and calculate checksums
        env:
          CI_BUILD_MATRIX: ${{ needs.prepare-builds.outputs.matrix }}
        run: python3 .github/ci/packages.py checksums dist "$CI_BUILD_MATRIX"
      - name: Upload package checksums
        uses: ./.github/actions/upload-package
        with:
          path: dist/fileneko_checksums.txt

  release:
    name: Release
    needs: ["lint-frontend", "test-frontend", "lint-backend", "test", "prepare-builds", "build", "checksums"]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.prepare-builds.outputs.go-version }}
      - name: Download shared frontend
        uses: actions/download-artifact@v8
        with:
          name: fileneko-frontend.tar
          path: ${{ runner.temp }}/frontend
          skip-decompress: true
      - name: Restore frontend assets
        run: tar -xf "$RUNNER_TEMP/frontend/fileneko-frontend.tar" -C frontend/dist
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
