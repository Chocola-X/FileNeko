version: 2

project_name: fileneko

release:
  github:
    owner: Chocola-X
    name: FileNeko

env:
  - GO111MODULE=on

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/filebrowser/filebrowser/v2/version.Version={{ .Version }} -X github.com/filebrowser/filebrowser/v2/version.CommitSHA={{ .ShortCommit }} -X github.com/filebrowser/filebrowser/v2/version.SourceURL=https://github.com/Chocola-X/FileNeko/archive/{{ .FullCommit }}.tar.gz
    main: main.go
    binary: fileneko
    goos:
      - darwin
      - linux
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
      - riscv64
    goarm:
      - "5"
      - "6"
      - "7"
    goamd64:
      - v1
    goarm64:
      - v8.0
    ignore:
      - goos: darwin
        goarch: "386"
      # Experimental, may not work properly
      - goos: openbsd
        goarch: riscv64
      # Broken as of Go 1.24, deprecated as of Go 1.26
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm
      # Marked broken by Go 1.26
      - goos: freebsd
        goarch: riscv64

archives:
  - name_template: "{{.Os}}-{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}-{{ .ProjectName }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - NOTICE
      - LICENSES/**
      - src: frontend/src/assets/fonts/*-OFL.txt
        dst: LICENSES/fonts
        strip_parent: true
      - src: docs/licensing.md
        dst: LICENSES
        strip_parent: true

# Official FileNeko Docker images are not currently produced.
# The inherited Docker build/push/manifest definitions have been disabled.
# Container configuration files may remain in the repository for future work.
