      - LICENSES
      - frontend/src/assets/fonts

docker_manifests:
  - name_template: "ghcr.io/chocola-x/fileneko:latest"
    image_templates:
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-amd64"
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-arm64"
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-armv7"
  - name_template: "ghcr.io/chocola-x/fileneko:{{ .Tag }}"
    image_templates:
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-amd64"
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-arm64"
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-armv7"
  - name_template: "ghcr.io/chocola-x/fileneko:v{{ .Major }}"
    image_templates:
      - "ghcr.io/chocola-x/fileneko:v{{ .Major }}-amd64"
      - "ghcr.io/chocola-x/fileneko:v{{ .Major }}-arm64"
      - "ghcr.io/chocola-x/fileneko:v{{ .Major }}-armv7"
  ## s6 image manifests
  - name_template: "ghcr.io/chocola-x/fileneko:s6"
    image_templates:
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-amd64-s6"
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-arm64-s6"
  - name_template: "ghcr.io/chocola-x/fileneko:{{ .Tag }}-s6"
    image_templates:
