version: 2

project_name: filebrowser

release:
  github:
    owner: Chocola-X
    name: FileNeko

env:
  - GO111MODULE=on

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/filebrowser/filebrowser/v2/version.Version={{ .Version }} -X github.com/filebrowser/filebrowser/v2/version.CommitSHA={{ .ShortCommit }} -X github.com/filebrowser/filebrowser/v2/version.SourceURL=https://github.com/Chocola-X/FileNeko/archive/{{ .FullCommit }}.tar.gz
    main: main.go
    binary: filebrowser
    goos:
      - darwin
      - linux
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
      - riscv64
    goarm:
      - "5"
      - "6"
      - "7"
    goamd64:
      - v1
    goarm64:
      - v8.0
    ignore:
      - goos: darwin
        goarch: "386"
      # Experimental, may not work properly
      - goos: openbsd
        goarch: riscv64
      # Broken as of Go 1.24, deprecated as of Go 1.26
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm
      # Marked broken by Go 1.26.
      - goos: freebsd
        goarch: riscv64

archives:
  - name_template: "{{.Os}}-{{.Arch}}{{if .Arm}}v{{.Arm}}{{end}}-{{ .ProjectName }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - NOTICE
      - LICENSES/**
      - src: frontend/src/assets/fonts/*-OFL.txt
        dst: LICENSES/fonts
        strip_parent: true
      - src: docs/licensing.md
        dst: LICENSES
        strip_parent: true

dockers:
  # Alpine docker images
  - dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/Chocola-X/FileNeko"
      - "--platform=linux/amd64"
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-amd64"
      - "ghcr.io/chocola-x/fileneko:v{{ .Major }}-amd64"
    extra_files:
      - docker
      - LICENSE
      - NOTICE
      - LICENSES
      - frontend/src/assets/fonts
  - dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/Chocola-X/FileNeko"
      - "--platform=linux/arm64"
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-arm64"
      - "ghcr.io/chocola-x/fileneko:v{{ .Major }}-arm64"
    extra_files:
      - docker
      - LICENSE
      - NOTICE
      - LICENSES
      - frontend/src/assets/fonts
  - dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/Chocola-X/FileNeko"
      - "--platform=linux/arm/v6"
    goos: linux
    goarch: arm
    goarm: "6"
    image_templates:
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-armv6"
      - "ghcr.io/chocola-x/fileneko:v{{ .Major }}-armv6"
    extra_files:
      - docker
      - LICENSE
      - NOTICE
      - LICENSES
      - frontend/src/assets/fonts
  - dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/Chocola-X/FileNeko"
      - "--platform=linux/arm/v7"
    goos: linux
    goarch: arm
    goarm: "7"
    image_templates:
