      - "ghcr.io/chocola-x/fileneko:v{{ .Major }}-armv7"
    extra_files:
      - docker
      - LICENSE
      - NOTICE
      - LICENSES
      - frontend/src/assets/fonts

  ## s6-overlay docker images
  - dockerfile: Dockerfile.s6
    use: buildx
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source=https://github.com/Chocola-X/FileNeko"
      - "--platform=linux/amd64"
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/chocola-x/fileneko:{{ .Tag }}-amd64-s6"
      - "ghcr.io/chocola-x/fileneko:v{{ .Major }}-amd64-s6"
    extra_files:
      - docker
