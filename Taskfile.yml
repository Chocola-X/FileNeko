version: '3'

tasks:
  build:frontend:
    desc: Build frontend assets
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm run build

  build:backend:
    desc: Build backend binary
    env:
      CGO_ENABLED: '0'
      GOAMD64: v1
      GOARM64: v8.0
    cmds:
      - go build -ldflags='-s -w -X "github.com/filebrowser/filebrowser/v2/version.Version={{.VERSION}}" -X "github.com/filebrowser/filebrowser/v2/version.CommitSHA={{.GIT_COMMIT}}" -X "github.com/filebrowser/filebrowser/v2/version.SourceURL=https://github.com/Chocola-X/FileNeko/archive/{{.GIT_FULL_COMMIT}}.tar.gz"' -o filebrowser .
    vars:
      GIT_COMMIT:
        sh: git log -n 1 --format=%h
      GIT_FULL_COMMIT:
        sh: git rev-parse HEAD
      VERSION:
        sh: |
          if task_version=$(git describe --tags --abbrev=0 --match='v*' 2>/dev/null); then
            printf '%s\n' "${task_version#v}"
          else
            printf '%s\n' '0.0.0-dev'
          fi

  build:
    desc: Build both frontend and backend
    cmds:
      - task: build:frontend
      - task: build:backend

  release:make:
    internal: true
    prompt: Do you wish to proceed?
    cmds:
      - pnpm dlx commit-and-tag-version -s

  release:dry-run:
    internal: true
    cmds:
      - pnpm dlx commit-and-tag-version --dry-run --skip

  release:
    desc: Create a new release
    cmds:
      - task: docs:cli:generate
      - git add docs/cli
      - |
        if [[ `git status docs/cli --porcelain` ]]; then
          git commit -m 'chore(docs): update CLI documentation'
        fi
      - task: release:dry-run
      - task: release:make

  docs:cli:generate:
    cmds:
      - rm -rf docs/cli
      - mkdir -p docs/cli
      - go run . docs
    generates:
      - docs/cli

